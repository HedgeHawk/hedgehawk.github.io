<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <meta name="robots" content="noindex" />
  <title>EPC QR</title>
  <meta name="color-scheme" content="light dark" />
  
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --line: #dddddd;
      --card: #f7f7f7;
      --accent: #111111;
      --error: #b00020;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f10;
        --fg: #f4f4f4;
        --muted: #aaaaaa;
        --line: #2a2a2d;
        --card: #17181a;
        --accent: #ffffff;
        --error: #ff7b8a;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 420px;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-top: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      line-height: 1.3;
    }

    p {
      margin: 0;
      line-height: 1.45;
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .spacer {
      height: 14px;
    }

    .row {
      display: grid;
      gap: 4px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-word;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--fg);
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--bg);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    #qrcode {
      min-width: 240px;
      min-height: 240px;
      padding: 10px;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .details {
      margin-top: 14px;
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
    }

    .error {
      margin-top: 10px;
      color: var(--error);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="start" class="hidden">
      <div class="card">
        <h1>Überweisung per QR-Code</h1>
        <p class="muted">IBAN erkannt. Betrag eingeben und QR-Code erzeugen.</p>

        <div class="spacer"></div>

        <div class="row">
          <span class="muted">IBAN</span>
          <span id="ibanText" class="mono"></span>
        </div>

        <div class="row" style="margin-top:10px;">
          <span class="muted">Empfänger</span>
          <span id="nameText"></span>
        </div>

        <div class="spacer"></div>

        <label for="amount">Betrag in Euro</label>
        <input
          id="amount"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="z. B. 12,50"
        />
        <button id="generateBtn">QR-Code erzeugen</button>

        <div id="message" class="error hidden"></div>
      </div>
    </section>

    <section id="result" class="hidden">
      <div class="card">
        <h1>Scan & bezahlen</h1>
        <p class="muted">EPC / SEPA QR-Code</p>

        <div class="qr-wrap">
          <div id="qrcode"></div>
        </div>

        <div class="details">
          <div class="row">
            <span class="muted">Empfänger</span>
            <span id="resultName"></span>
          </div>
          <div class="row">
            <span class="muted">IBAN</span>
            <span id="resultIban" class="mono"></span>
          </div>
          <div class="row">
            <span class="muted">Betrag</span>
            <span id="resultAmount"></span>
          </div>
        </div>

        <button id="editBtn">Betrag ändern</button>
      </div>
    </section>

    <section id="invalid" class="hidden">
      <div class="card">
        <h1>Ungültige Daten</h1>
        <p class="muted">IBAN oder Empfängername sind ungültig oder unvollständig.</p>
      </div>
    </section>
  </main>

  <script src="assets/js/qrcode.min.js"></script>

  <script>
    (function () {
      const IBAN_LENGTHS = {
        AL: 28, AD: 24, AT: 20, AZ: 28, BH: 22, BE: 16, BA: 20, BR: 29, BG: 22,
        CR: 22, HR: 21, CY: 28, CZ: 24, DK: 18, DO: 28, EE: 20, FO: 18, FI: 18,
        FR: 27, GE: 22, DE: 22, GI: 23, GR: 27, GL: 18, GT: 28, HU: 28, IS: 26,
        IE: 22, IL: 23, IT: 27, JO: 30, KZ: 20, XK: 20, KW: 30, LV: 21, LB: 28,
        LI: 21, LT: 20, LU: 20, MT: 31, MR: 27, MU: 30, MC: 27, MD: 24, ME: 22,
        NL: 18, MK: 19, NO: 15, PK: 24, PS: 29, PL: 28, PT: 25, QA: 29, RO: 24,
        SM: 27, SA: 24, RS: 22, SK: 24, SI: 19, ES: 24, SE: 24, CH: 21, TL: 23,
        TN: 24, TR: 26, AE: 23, GB: 22, VA: 22, VG: 24
      };

      const params = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
      const rawIban = params.get("iban");
      const rawName = params.get("name");

      const startSection = document.getElementById("start");
      const resultSection = document.getElementById("result");
      const invalidSection = document.getElementById("invalid");

      const ibanText = document.getElementById("ibanText");
      const nameText = document.getElementById("nameText");
      const amountInput = document.getElementById("amount");
      const generateBtn = document.getElementById("generateBtn");
      const editBtn = document.getElementById("editBtn");
      const message = document.getElementById("message");
      const qrcodeEl = document.getElementById("qrcode");

      const resultName = document.getElementById("resultName");
      const resultIban = document.getElementById("resultIban");
      const resultAmount = document.getElementById("resultAmount");

      if (!rawIban || !rawName) return;

      const iban = normalizeIban(rawIban);
      const recipientName = sanitizeName(rawName);

      if (!recipientName || !isValidIban(iban)) {
        invalidSection.classList.remove("hidden");
        return;
      }

      ibanText.textContent = formatIban(iban);
      nameText.textContent = recipientName;
      startSection.classList.remove("hidden");
      amountInput.focus();

      generateBtn.addEventListener("click", generate);
      amountInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") generate();
      });
      editBtn.addEventListener("click", function () {
        resultSection.classList.add("hidden");
        startSection.classList.remove("hidden");
        amountInput.focus();
        amountInput.select();
      });

      function generate() {
        hideMessage();

        if (typeof QRCode !== "function") {
          showMessage("QR-Bibliothek nicht gefunden.");
          return;
        }

        const parsed = parseAmount(amountInput.value);
        if (!parsed.ok) {
          showMessage(parsed.error);
          return;
        }

        const amount = parsed.value;
        const epcPayload = buildEpcPayload({
          name: recipientName,
          iban: iban,
          amount: amount
        });

        if (new TextEncoder().encode(epcPayload).length > 331) {
          showMessage("Die EPC-Daten sind zu lang.");
          return;
        }

        qrcodeEl.innerHTML = "";

        new QRCode(qrcodeEl, {
          text: epcPayload,
          width: 240,
          height: 240,
          correctLevel: QRCode.CorrectLevel.M
        });

        resultName.textContent = recipientName;
        resultIban.textContent = formatIban(iban);
        resultAmount.textContent = amount.replace(".", ",") + " €";

        startSection.classList.add("hidden");
        resultSection.classList.remove("hidden");
      }

      function normalizeIban(value) {
        return String(value).replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }

      function formatIban(value) {
        return value.replace(/(.{4})/g, "$1 ").trim();
      }

      function sanitizeName(value) {
        return String(value)
          .replace(/[\u0000-\u001F\u007F]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 70);
      }

      function isValidIban(iban) {
        if (!/^[A-Z]{2}[0-9]{2}[A-Z0-9]+$/.test(iban)) {
          return false;
        }

        const country = iban.slice(0, 2);
        const expectedLength = IBAN_LENGTHS[country];
        if (!expectedLength || iban.length !== expectedLength) {
          return false;
        }

        const rearranged = iban.slice(4) + iban.slice(0, 4);
        let remainder = 0;

        for (const ch of rearranged) {
          const chunk = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch;
          for (const digit of chunk) {
            remainder = (remainder * 10 + Number(digit)) % 97;
          }
        }

        return remainder === 1;
      }

      function parseAmount(input) {
        const raw = String(input).trim().replace(/\s+/g, "").replace(",", ".");
        if (!raw) {
          return { ok: false, error: "Bitte einen Betrag eingeben." };
        }

        if (!/^\d+(\.\d{1,2})?$/.test(raw)) {
          return { ok: false, error: "Bitte einen gültigen Betrag eingeben, z. B. 12,50." };
        }

        const value = Number(raw);
        if (!Number.isFinite(value) || value <= 0) {
          return { ok: false, error: "Der Betrag muss größer als 0 sein." };
        }

        if (value > 999999999.99) {
          return { ok: false, error: "Der Betrag ist zu groß." };
        }

        return { ok: true, value: value.toFixed(2) };
      }

      function buildEpcPayload(data) {
        return [
          "BCD",
          "002",
          "1",
          "SCT",
          "",
          data.name,
          data.iban,
          "EUR" + data.amount,
          "",
          "",
          ""
        ].join("\n");
      }

      function showMessage(text) {
        message.textContent = text;
        message.classList.remove("hidden");
      }

      function hideMessage() {
        message.textContent = "";
        message.classList.add("hidden");
      }
    })();
  </script>
</body>
</html>
